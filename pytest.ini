[pytest]
testpaths = tests
base_url = http://127.0.0.1:8000
cache_dir = .cache/pytest
addopts =
    -ra
    --strict-markers
    --alluredir=allure-results
    --clean-alluredir
    --screenshot=only-on-failure
    --output=test-results
    --tracing=retain-on-failure
markers =
    smoke: 核心冒烟测试
    regression: 完整回归测试

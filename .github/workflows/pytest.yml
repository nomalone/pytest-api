name: pytest API and UI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  api-tests:
    # 指定虚拟机环境
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run API tests
        run: python -m pytest tests/api
      #上传原始结果是为了后续下载汇总
      - name: Upload API Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-api
          path: allure-results
          if-no-files-found: warn
          retention-days: 7

  ui-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 要替换的变量和值
      matrix:
        browser: [ chromium, firefox ]

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Run UI tests
        run: python -m pytest tests/ui --browser ${{ matrix.browser }}

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-${{ matrix.browser }}
          path: test-results
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results
          if-no-files-found: warn
          retention-days: 7

  allure-report:
    needs: [api-tests, ui-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download Allure results
        uses: actions/download-artifact@v5
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Allure CLI
        run: npm install --global allure-commandline@2.46.1

      - name: Generate Allure report
        run: allure generate allure-results -o allure-report --clean

      - name: Upload Allure report
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: warn

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report/

  deploy-report:
    # API和UI测试、报告生成全部完成后再部署
    needs: [api-tests, ui-tests, allure-report]
    #触发部署任务条件
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Github Pages
        id: deployment
        uses: actions/deploy-pages@v4

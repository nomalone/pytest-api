name: pytest API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  api-tests:
    # 指定虚拟机环境
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt


      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Allure CLI
        run: npm install --global allure-commandline@2.46.1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium firefox

      - name: Run pytest
        run: python -m pytest --browser chromium --browser firefox

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results
          if-no-files-found: warn
          retention-days: 7

      #生成测试报告
      - name: Generate Allure report
        if: always()
        run: allure generate allure-results -o allure-report --clean
      #把报告作为名为allure-report的做下载附件，保存到actions记录中
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: warn
      #把报告打包成Pages部署可识别的artifact
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report/

  deploy-report:
    #api-tests完成后进行下面的，并且需要api-tests执行成功才会执行
    needs: api-tests
    #触发部署任务条件
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Github Pages
        id: deployment
        uses: actions/deploy-pages@v4
